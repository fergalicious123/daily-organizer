<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Catch it now, sort it later. Notes that become tasks in the Daily Organizer.">
<meta name="theme-color" content="#1e1e1c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Catch">
<title>Catch</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="../icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../icons/icon-192.png">

<!--
  The styles are INLINE, and that is the whole point of this file.

  Ben asked for something quick to open and fast to load. A linked stylesheet is
  one more round trip before anything can paint, and this app's entire job is to
  be ready to take a sentence before the thought goes. Everything needed for the
  first paint is here; the fonts and the logic arrive after, and the app is
  usable before they do.

  Deliberately does NOT share the organizer's stylesheet: that file is 120KB of
  calendar grids and month cells, none of which this app has.
-->
<style>
:root {
  --bg: #1e1e1c; --surface: #2a2a27; --sunk: #181817;
  --line: #3a3a36; --line-firm: #7e7d77;
  --text: #f0efe9; --muted: #adaba1;
  --accent: #9ad2ea; --accent-soft: #182a33; --accent-ink: #1e1e1c;
  --danger: #ef8a78; --good: #8fd0a8; --warn: #e3b45c;
  --radius: 12px; --radius-lg: 18px;
  --font: Figtree, "Segoe UI Variable Text", -apple-system, BlinkMacSystemFont,
          "Segoe UI", Roboto, system-ui, "Helvetica Neue", Arial, sans-serif;
  --font-display: "Instrument Serif", Georgia, "Times New Roman", serif;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #f6f5f1; --surface: #ffffff; --sunk: #edebe4;
    --line: #e1ded5; --line-firm: #8d8980;
    --text: #22221c; --muted: #5c5a51;
    --accent: #1f5d80; --accent-soft: #e2eef5; --accent-ink: #ffffff;
    --danger: #b23a2b; --good: #1f6d4c; --warn: #8a5610;
  }
}

/* The two faces the organizer already caches, so on a phone that has opened it
   once these cost nothing. Declared with swap so a cold start paints in the
   system face rather than waiting. */
@font-face {
  font-family: Figtree;
  src: url("../fonts/figtree-latin-var.woff2") format("woff2");
  font-weight: 400 700; font-style: normal; font-display: swap;
}
@font-face {
  font-family: "Instrument Serif";
  src: url("../fonts/instrumentserif-latin.woff2") format("woff2");
  font-weight: 400; font-style: normal; font-display: swap;
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; overscroll-behavior-y: none; }
body {
  background: var(--bg); color: var(--text);
  font-family: var(--font); font-size: 16px; line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  display: flex; flex-direction: column;
}

header {
  display: flex; align-items: baseline; gap: 10px;
  padding: 14px 18px 6px;
  padding-top: max(14px, env(safe-area-inset-top, 0px));
}
h1 { font-family: var(--font-display); font-weight: 400; font-size: 27px; margin: 0; }
.count { font-size: 13px; color: var(--muted); margin-left: auto; }
.to-organizer {
  font-size: 13px; color: var(--accent); text-decoration: none;
  padding: 4px 0;
}

main { flex: 1; overflow-y: auto; padding: 0 18px 12px; }

/* The composer is the reason the app exists, so it is the first thing and the
   biggest thing. */
.composer {
  display: flex; flex-direction: column; gap: 9px;
  padding: 12px; margin: 6px 0 16px;
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--radius-lg);
}
#box {
  width: 100%; min-height: 78px; resize: vertical;
  background: transparent; border: 0; outline: none;
  color: var(--text); font: inherit; line-height: 1.5;
}
#box::placeholder { color: var(--muted); }
.composer-row { display: flex; align-items: center; gap: 8px; }
.status { font-size: 12.5px; color: var(--muted); margin-left: auto; }

button {
  font: inherit; cursor: pointer; border-radius: 999px;
  border: 1px solid var(--line); background: var(--surface);
  color: var(--text); padding: 9px 15px;
  transition: background .12s, border-color .12s, transform .06s;
}
button:active { transform: scale(.97); }
button:disabled { opacity: .5; cursor: default; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.mic { display: flex; align-items: center; gap: 8px; padding-left: 12px; }
.mic svg { width: 18px; height: 18px; }
.mic.live {
  background: var(--danger); border-color: var(--danger); color: #1e1e1c; font-weight: 600;
  animation: pulse 1.4s ease-in-out infinite;
}
@keyframes pulse { 50% { opacity: .6; } }
@media (prefers-reduced-motion: reduce) { .mic.live { animation: none; } }

.section-label {
  font-size: 10.5px; font-weight: 650; letter-spacing: .08em;
  text-transform: uppercase; color: var(--muted);
  margin: 18px 0 8px;
}

.line {
  display: flex; align-items: flex-start; gap: 10px;
  padding: 11px 13px; margin-bottom: 7px;
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--radius);
}
.line-main { flex: 1; min-width: 0; }
.line-text { margin: 0; font-size: 15px; line-height: 1.45; overflow-wrap: anywhere; }
/* What you actually said, kept under a rewording so the suggestion never
   quietly replaces your own words. */
.line-original {
  margin: 4px 0 0; font-size: 12.5px; color: var(--muted);
  padding-left: 9px; border-left: 2px solid var(--line);
}
.line-why { margin: 4px 0 0; font-size: 12.5px; color: var(--muted); }
.line-when { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.line-actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 9px; }
.line-actions button { padding: 5px 11px; font-size: 13px; }
/* Bin is the destructive one and it sat flush against "Just a note". Pushed to
   the end of the row with a gap, so the button that deletes something is not
   the one your thumb finds next to the button that keeps it. */
.line-actions .bin { margin-left: auto; }

/* On touch every one of these was 32px tall — over the bare minimum and well
   under what a thumb wants, on the app most likely to be used one-handed
   standing next to a vehicle. */
@media (hover: none), (max-width: 620px) {
  .line-actions button { min-height: 44px; padding: 8px 14px; }
  .to-organizer { min-height: 44px; display: flex; align-items: center; }
  button { min-height: 44px; }
}
.tag {
  font-size: 10px; font-weight: 650; text-transform: uppercase; letter-spacing: .06em;
  padding: 2px 7px; border-radius: 999px; align-self: flex-start;
}
.tag.now { background: var(--accent-soft); color: var(--accent); }
.tag.later { background: var(--sunk); color: var(--muted); }
.tag.note { background: var(--sunk); color: var(--muted); }
.tag.sent { background: var(--sunk); color: var(--good); }

.empty { text-align: center; color: var(--muted); padding: 34px 12px; font-size: 14px; }
.bar { display: flex; gap: 8px; flex-wrap: wrap; margin: 4px 0 2px; }
.err { color: var(--danger); font-size: 13.5px; margin: 8px 0 0; }
.hint { color: var(--muted); font-size: 12.5px; margin: 8px 0 0; line-height: 1.5; }

.spinner {
  width: 13px; height: 13px; border: 2px solid var(--line-firm);
  border-top-color: var(--accent); border-radius: 50%;
  display: inline-block; animation: spin .7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 2.4s; } }

.toast {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: max(18px, env(safe-area-inset-bottom, 0px));
  background: var(--surface); border: 1px solid var(--line);
  border-radius: 999px; padding: 10px 18px; font-size: 14px;
  box-shadow: 0 2px 12px rgba(0,0,0,.45);
}
</style>
</head>
<body>

<header>
  <h1>Catch</h1>
  <a class="to-organizer" href="../">Organizer →</a>
</header>

<main id="app">
  <div class="composer">
    <textarea id="box" rows="3" placeholder="What is it?" autocomplete="off"
              autocapitalize="sentences" spellcheck="true"></textarea>
    <div class="composer-row">
      <button id="mic" class="mic" type="button" aria-label="Dictate">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="9.25" y="2.75" width="5.5" height="11" rx="2.75"/>
          <path d="M5.75 11.25a6.25 6.25 0 0 0 12.5 0M12 17.5v3.75M8.75 21.25h6.5"/>
        </svg>
        <span id="micLabel">Talk</span>
      </button>
      <button id="add" class="primary" type="button">Catch it</button>
      <span class="status" id="status"></span>
    </div>
  </div>
  <div id="list"></div>
</main>

<script type="module" src="./capture.js"></script>
<noscript><p style="padding:24px">This needs JavaScript.</p></noscript>

</body>
</html>
