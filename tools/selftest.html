<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily Organizer — self test</title>
<style>
  :root { color-scheme: light dark; }
  body {
    font: 14px/1.55 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    margin: 0; padding: 24px; max-width: 900px;
  }
  h1 { font-size: 18px; margin: 0 0 4px; }
  .lede { opacity: .7; margin: 0 0 20px; max-width: 70ch; font-size: 13px; }
  #out { white-space: pre-wrap; }
  .pass { color: #1f7a54; }
  .fail { color: #c0392b; font-weight: 700; }
  .group { margin-top: 16px; font-weight: 700; }
  #summary { margin-top: 22px; padding: 12px 14px; border-radius: 8px; font-weight: 700; }
  #summary.ok { background: #e4f1eb; color: #1f7a54; }
  #summary.bad { background: #fbeae8; color: #c0392b; }
  @media (prefers-color-scheme: dark) {
    body { background: #0e1016; color: #e9ecf3; }
    .pass { color: #5fc79b; } .fail { color: #ef8073; }
    #summary.ok { background: #142a22; color: #5fc79b; }
    #summary.bad { background: #351f1d; color: #ef8073; }
  }
</style>
</head>
<body>

<h1>Self test</h1>
<p class="lede">
  Runs against the real modules with no build step: open
  <code>/tools/selftest.html</code> on the dev server and read the result.
  Everything here is a PURE function called with arguments — nothing touches
  the store, localStorage, or the network, so running this cannot disturb your
  data.
</p>

<div id="out"></div>
<div id="summary"></div>

<script type="module">
const out = document.getElementById('out');
let passed = 0;
let failed = 0;

function group(name) {
  out.appendChild(Object.assign(document.createElement('div'),
    { className: 'group', textContent: name }));
}

/*
 * `fn` is a function, not a value, and that is the whole point.
 *
 * The first version took an already-evaluated boolean. Then a deliberate break
 * was introduced to check this file could actually fail, and one assertion
 * threw a TypeError on the way to producing its boolean — which killed the
 * script, so two failures were reported, no summary was rendered, and every
 * check after that point silently never ran. A suite that stops at the first
 * broken thing is worse than none: it reports a short list of problems and
 * looks like it finished.
 */
function check(label, fn, detail = '') {
  let ok = false;
  let thrown = '';
  try {
    ok = Boolean(typeof fn === 'function' ? fn() : fn);
  } catch (err) {
    thrown = err.message;
  }
  ok ? passed++ : failed++;
  const line = document.createElement('div');
  line.className = ok ? 'pass' : 'fail';
  const why = thrown || (!ok ? detail : '');
  line.textContent = `${ok ? '  ok  ' : ' FAIL '} ${label}${why ? `  — ${why}` : ''}`;
  out.appendChild(line);
}

/* ------------------------------------------------------------------ */
/* Every module still parses                                           */
/* ------------------------------------------------------------------ */
/*
 * app.js is deliberately absent: it calls boot() at import time, so pulling it
 * in here would start a second copy of the whole app against this origin's
 * storage. Its syntax is checked by the app opening at all.
 */
group('Modules parse');
const MODULES = [
  'state', 'dates', 'ui', 'chart', 'voice', 'google', 'sync', 'notify',
  'brief', 'quotes', 'ai', 'reflect', 'daylog', 'triage', 'plan', 'dragdrop', 'shortcuts',
  'countdown', 'usage', 'markdown', 'paste', 'together', 'zones', 'search',
].map((n) => `../js/${n}.js`).concat(
  ['calendar', 'tasks', 'home', 'done', 'journal', 'routine', 'bin', 'review',
    'clocks', 'shortcutsPanel', 'planpanel', 'datepicker'].map((n) => `../js/views/${n}.js`),
);

const loaded = {};
for (const path of MODULES) {
  try {
    loaded[path] = await import(path);
    check(path, true);
  } catch (err) {
    check(path, false, err.message);
  }
}

const { gcalIdFor } = loaded['../js/google.js'] || {};
const { mergeDocuments } = loaded['../js/sync.js'] || {};
const { verify, materialToText, hasMaterial } = loaded['../js/reflect.js'] || {};
const dates = loaded['../js/dates.js'] || {};

/* ------------------------------------------------------------------ */
/* Calendar event ids                                                  */
/* ------------------------------------------------------------------ */
/* These are what stop a create whose reply was lost becoming a duplicate. */
group('gcalIdFor — deterministic, legal, distinct');
if (gcalIdFor) {
  const LEGAL = /^[0-9a-v]{5,1024}$/;   // Google's base32hex rule
  const samples = [
    '2f3a9b1c-4d5e-4f60-9a8b-7c6d5e4f3a2b',
    'id-m4x9k2-a7bz3q1w',
    'spaces and Ünïcode ☺',
    'x',
  ];
  check('every id is legal for Google', () => samples.every((s) => LEGAL.test(gcalIdFor(s))));
  check('same input gives the same id', () => samples.every((s) => gcalIdFor(s) === gcalIdFor(s)));
  check('different inputs give different ids', () => new Set(samples.map(gcalIdFor)).size === samples.length);
  check('short input still clears the 5-char floor', () => gcalIdFor('x').length >= 5);
}

/* ------------------------------------------------------------------ */
/* Quote verification                                                  */
/* ------------------------------------------------------------------ */
/* The thing that stops an invented suggestion looking like a grounded one. */
group('verify — catches a paraphrase, forgives punctuation');
if (verify) {
  const source = 'Docs for the Landy are out of date, need Ferguson to sign them off.\n'
    + 'Right knee tight again on the downhills.';
  const v = (q) => verify([{ quote: q }], source)[0].verified;
  check('exact quote passes', () => v('need Ferguson to sign them off'));
  check('different case passes', () => v('NEED FERGUSON TO SIGN THEM OFF'));
  check('a newline read as a space passes', () => v('sign them off. Right knee tight'));
  check('a paraphrase is caught', () => !v('Ferguson needs to sign the documents'));
  check('an invented quote is caught', () => !v('book the dentist on Tuesday'));
  check('an empty quote is caught', () => !v(''));
  check('word soup is caught', () => !v('Ferguson downhills Landy'));
}

/* ------------------------------------------------------------------ */
/* Sync merge                                                          */
/* ------------------------------------------------------------------ */
/* Every failure here is silent, unrecoverable data loss. */
group('mergeDocuments — notes survive two devices');
if (mergeDocuments) {
  const base = { items: [], lists: [], journal: {}, journalSummary: {}, routine: {} };
  const doc = (log, updatedAt, title = 'Task') =>
    ({ ...base, items: [{ id: 'i1', title, updatedAt, log }] });

  const phone = doc([{ id: 'a', at: '2026-08-20T10:00:00Z', text: 'phone' }], '2026-08-20T10:00:00Z');
  const laptop = doc([{ id: 'b', at: '2026-08-20T11:00:00Z', text: 'laptop' }], '2026-08-20T11:00:00Z');
  const merged = mergeDocuments(phone, laptop).document.items[0];
  check('a note from each device survives', () => merged.log.length === 2 && merged.log.map((n) => n.id).sort().join() === 'a,b');
  check('notes come back in time order', () => merged.log[0].id === 'a' && merged.log[1].id === 'b');

  // An item edited by a device running older code has no `log` at all.
  const noLog = { ...base, items: [{ id: 'i1', title: 'Renamed', updatedAt: '2026-08-21T10:00:00Z' }] };
  const kept = mergeDocuments(doc([{ id: 'a', at: '2026-08-20T10:00:00Z', text: 'keep me' }],
    '2026-08-20T10:00:00Z'), noLog).document.items[0];
  check('a newer side with no log does not wipe notes', () => kept.log.length === 1 && kept.log[0].text === 'keep me');
  check('the newer side still wins on ordinary fields', () => kept.title === 'Renamed');

  // A delete must not be handed back by a device that still holds a copy.
  const buried = doc([{ id: 'a', at: '2026-08-20T10:00:00Z', text: '', deleted: true }], '2026-08-21T09:00:00Z');
  const alive = doc([{ id: 'a', at: '2026-08-20T10:00:00Z', text: 'zombie' }], '2026-08-20T10:00:00Z');
  check('a delete sticks when local buried it', () => mergeDocuments(buried, alive).document.items[0].log.every((n) => n.deleted));
  check('a delete sticks when remote buried it', () => mergeDocuments(alive, buried).document.items[0].log.every((n) => n.deleted));

  // A day's written-up summary lives in its OWN map, not on the journal entry,
  // precisely so these two cannot overwrite each other.
  const withText = { ...base, journal: { d: { text: 'typed on the phone', updatedAt: '2026-08-27T21:00:00Z' } } };
  const withSummary = { ...base, journalSummary: { d: { text: 'written on the laptop', updatedAt: '2026-08-27T22:00:00Z' } } };
  const bothWays = mergeDocuments(withText, withSummary).document;
  check('a typed entry and a summary both survive', () =>
    bothWays.journal.d.text === 'typed on the phone'
    && bothWays.journalSummary.d.text === 'written on the laptop');
  check('a summary survives a remote that has no summaries at all', () =>
    mergeDocuments({ ...base, journalSummary: { d: { text: 'keep me', updatedAt: '2026-08-27T10:00:00Z' } } },
      { items: [], lists: [], journal: {}, routine: {} }).document.journalSummary.d.text === 'keep me');
}

/* ------------------------------------------------------------------ */
/* Review material                                                     */
/* ------------------------------------------------------------------ */
group('reflect — nothing in, nothing sent');
if (materialToText && hasMaterial) {
  const empty = { from: '2026-08-01', to: '2026-08-08', notes: [], journal: [], done: [], slipped: [] };
  check('empty material reports as empty', () => hasMaterial(empty) === false);
  check('empty material renders no text', () => materialToText(empty) === '');
  const some = { ...empty, notes: [{ day: '2026-08-02', itemTitle: 'Job', text: 'a note' }] };
  check('a single note is enough to have material', () => hasMaterial(some) === true);
  check('the note reaches the text', () => materialToText(some).includes('a note'));
}

/* ------------------------------------------------------------------ */
/* Dates                                                               */
/* ------------------------------------------------------------------ */
/* Local wall-clock, never UTC instants — the rule the whole app rests on. */
group('dates — local wall-clock, boundaries intact');
if (dates.addDays) {
  check('crosses a month end', () => dates.addDays('2026-01-31', 1) === '2026-02-01');
  check('crosses a year end', () => dates.addDays('2026-12-31', 1) === '2027-01-01');
  check('handles a leap day', () => dates.addDays('2028-02-28', 1) === '2028-02-29');
  check('steps backwards', () => dates.addDays('2026-03-01', -1) === '2026-02-28');
  // The clocks go forward on 29 March 2026 in the UK. A UTC-based
  // implementation loses or repeats a day here; a wall-clock one does not.
  check('survives the spring clock change', () => dates.addDays('2026-03-28', 2) === '2026-03-30');
  check('survives the autumn clock change', () => dates.addDays('2026-10-24', 2) === '2026-10-26');
  check('diffDays agrees with addDays', () => dates.diffDays('2026-08-01', '2026-08-15') === 14);
  // The short month form exists because "September 2026" does not fit a phone
  // header; it has to stay short for the longest month there is.
  check('the short month form is short', () => dates.formatMonthShort('2026-09-15') === 'Sep 2026');
  check('and keeps the year', () => dates.formatMonthShort('2027-01-01') === 'Jan 2027');
}
/* The boundary that matters: TODAY IS NOT PAST. Every day cell in the app is a
   drop target, and getting this off by one either hatches today — telling you
   the day you are living in has gone — or fails to hatch yesterday, which is
   the mistake the whole thing exists to prevent. */
if (dates.isPast) {
  const today = dates.todayKey();
  check('today is not past', () => dates.isPast(today) === false);
  check('yesterday is past', () => dates.isPast(dates.addDays(today, -1)) === true);
  check('tomorrow is not past', () => dates.isPast(dates.addDays(today, 1)) === false);
  check('a year back is past', () => dates.isPast(dates.addDays(today, -365)) === true);
  check('no date is not past', () => dates.isPast(null) === false && dates.isPast('') === false);
  // Compares as text, so it has to sort correctly across a month and year end.
  check('sorts across a month end', () => dates.isPast('2026-08-31') === (dates.addDays(today, 0) > '2026-08-31'));
}

/* ------------------------------------------------------------------ */
/* Countdowns                                                          */
/* ------------------------------------------------------------------ */
/* The boundaries are the whole behaviour: a countdown that keeps counting
   after the date has passed is the failure this is written to prevent, and
   it is invisible until the day after something you cared about. */
group('countdown — counts down, then stops');
const cd = loaded['../js/countdown.js'] || {};
if (cd.countdown) {
  const from = '2026-08-31';
  check('a future date gives the number of days', () => cd.countdown('2026-09-20', 'English course', from).days === 20);
  check('and phrases it plainly', () => cd.countdown('2026-09-20', 'English course', from).text === '20 days');
  check('the day itself is named', () => cd.countdown(from, 'English course', from).text === 'English course today');
  check('tomorrow is said, not counted', () => cd.countdown('2026-09-01', 'x', from).text === 'Tomorrow');
  check('a past date counts nothing at all', () => cd.countdown('2026-08-30', 'x', from) === null);
  check('no target counts nothing', () => cd.countdown('', 'x', from) === null);
  // Seven days is the line where a number becomes a deadline. Off by one here
  // and the colour change lands on the wrong day.
  check('seven days out is urgent', () => cd.countdown('2026-09-07', 'x', from).urgent === true);
  check('eight days out is not', () => cd.countdown('2026-09-08', 'x', from).urgent === false);
  check('the day itself is urgent', () => cd.countdown(from, 'x', from).urgent === true);
}
if (cd.itemCountdowns) {
  const from = '2026-08-31';
  const items = [
    { id: 'a', title: 'Far', date: '2026-10-10', countdown: true },
    { id: 'b', title: 'Near', date: '2026-09-02', countdown: true },
    { id: 'c', title: 'Past', date: '2026-08-01', countdown: true },
    { id: 'd', title: 'Unflagged', date: '2026-09-03' },
    { id: 'e', title: 'Done', date: '2026-09-04', countdown: true, done: true },
    { id: 'f', title: 'Undated', date: null, countdown: true },
  ];
  const list = cd.itemCountdowns(items, from);
  check('only flagged, dated, live items count', () => list.length === 2);
  check('soonest first', () => list[0].item.title === 'Near' && list[1].item.title === 'Far');
  check('a past one drops out rather than going negative', () => !list.some((e) => e.item.title === 'Past'));
  check('a completed one stops counting', () => !list.some((e) => e.item.title === 'Done'));
  check('an undated one cannot count', () => !list.some((e) => e.item.title === 'Undated'));
}

/* ------------------------------------------------------------------ */
/* makeItem                                                            */
/* ------------------------------------------------------------------ */
/* Two callers pass `undefined` deliberately, meaning "you choose". Object
   spread copies undefined like any other value, so both were getting their
   default wiped instead — and the one that hurt was the next occurrence of a
   repeating task, created with NO id and therefore uneditable, undeletable
   and unsyncable. Nothing in the app said so; the row simply did not respond.

   These call the real makeItem against the real store, which is safe: it
   builds an object and returns it, and nothing here is ever pushed. */
group('makeItem — saying nothing and saying undefined are not the same');
const state = loaded['../js/state.js'] || {};
if (state.makeItem) {
  check('an omitted id is generated', () => Boolean(state.makeItem({}).id));
  check('an explicitly undefined id is still generated', () => Boolean(state.makeItem({ id: undefined }).id));
  check('two items never share an id', () => state.makeItem({ id: undefined }).id !== state.makeItem({ id: undefined }).id);
  check('an explicitly undefined list falls back to the default', () => Boolean(state.makeItem({ listId: undefined }).listId));
  check('a real value still wins', () => state.makeItem({ listId: 'list-work' }).listId === 'list-work');
  // null is a value someone chose, and it has to survive: a task with no date
  // is the normal way to say "unscheduled".
  check('an explicit null is kept, not treated as unsaid', () => state.makeItem({ date: null }).date === null);
  check('a false is kept too', () => state.makeItem({ done: false }).done === false);
}

/* ------------------------------------------------------------------ */
/* Usage counters                                                      */
/* ------------------------------------------------------------------ */
/* The merge is the whole risk here. Counts that are meant to answer "what do
   I cut" are worthless if syncing two devices quietly loses or doubles them,
   and neither failure is visible by looking. */
group('usage — counts survive two devices');
if (mergeDocuments) {
  const base = { items: [], lists: [], journal: {}, routine: {} };
  const A = { ...base, updatedAt: '2026-08-01T10:00:00.000Z',
    usage: { phone: { VIEW_DAY: { n: 10, first: 'a', last: 'y' } }, laptop: { VIEW_DAY: { n: 3, first: 'b', last: 'x' } } } };
  const B = { ...base, updatedAt: '2026-08-01T11:00:00.000Z',
    usage: { phone: { VIEW_DAY: { n: 4, first: 'a', last: 'z' } }, desk: { REVIEW_RUN: { n: 2, first: 'c', last: 'w' } } } };
  const out = mergeDocuments(A, B).document.usage;
  // The phone's own count only ever goes up, so the higher number is the more
  // recent truth. Taking the newer DOCUMENT would have thrown 10 away for 4.
  check('a device’s higher count wins', () => out.phone.VIEW_DAY.n === 10);
  check('counts are not added together', () => out.phone.VIEW_DAY.n !== 14);
  check('a device only the local side knows survives', () => out.laptop.VIEW_DAY.n === 3);
  check('a device only the remote side knows survives', () => out.desk.REVIEW_RUN.n === 2);
  check('the later last-used is kept', () => out.phone.VIEW_DAY.last === 'z');
  // Merging twice must not change the answer, or repeated syncs would drift.
  const twice = mergeDocuments(mergeDocuments(A, B).document, B).document.usage;
  check('merging again changes nothing', () => JSON.stringify(twice) === JSON.stringify(out));
}

/* ------------------------------------------------------------------ */
/* Markdown                                                            */
/* ------------------------------------------------------------------ */
/* This renders text that arrived from somewhere else, so the first thing it
   has to get right is not turning that text into markup that runs. The rest
   is structure: a pasted table is worth keeping only if it stays a table. */
group('markdown - structure survives, scripts do not');
const md = loaded['../js/markdown.js'] || {};
const draw = (src) => {
  const host = document.createElement('div');
  host.appendChild(md.renderMarkdown(src));
  return host;
};
if (md.renderMarkdown) {
  const table = [
    '| Service No | Rank | Name |',
    '|---|---|---|',
    '| A8444971 | Pte | Johnston, Callum |',
    '| 30283213 | Pte | Richards, Malcolm |',
  ].join('\n');
  const t = draw(table);
  check('a pipe table becomes a table', () => t.querySelectorAll('table').length === 1);
  check('with its header cells', () => t.querySelectorAll('thead th').length === 3);
  check('and a row per line', () => t.querySelectorAll('tbody tr').length === 2);
  check('cell text is kept intact', () => t.querySelectorAll('tbody td')[0].textContent === 'A8444971');
  check('the table can scroll on its own', () => t.querySelectorAll('.md-table-wrap').length === 1);

  // A ragged row must not shear the columns out of line with the headings.
  const ragged = draw(['| A | B | C |', '|---|---|---|', '| 1 |'].join('\n'));
  check('a short row is padded to the header width',
    () => ragged.querySelectorAll('tbody tr td').length === 3);

  // A sentence with a pipe in it is not a table.
  const notTable = draw('Ask Hunter | Polean about the SCA scores');
  check('a stray pipe does not start a table', () => !notTable.querySelector('table'));

  const h = draw('# Title\n## Section\n### Deeper');
  // Shifted down two: an entry already sits inside the page's own headings.
  check('headings shift below the page level', () => h.querySelector('h3') && !h.querySelector('h1'));
  check('every heading level renders', () => h.querySelectorAll('.md-h').length === 3);

  const inline = draw('A **bold** and *italic* and `code` word.');
  check('bold renders', () => inline.querySelector('strong')?.textContent === 'bold');
  check('italic renders', () => inline.querySelector('em')?.textContent === 'italic');
  check('code renders', () => inline.querySelector('code')?.textContent === 'code');
  check('bold is not read as italic in asterisks',
    () => draw('**x**').querySelector('strong') && !draw('**x**').querySelector('em'));
  // Asterisks inside a code span are not markup.
  check('markup inside code is left alone',
    () => draw('`a **b** c`').querySelector('code').textContent === 'a **b** c');

  const lists = draw('- one\n- two\n- three');
  check('a bullet list renders', () => lists.querySelectorAll('ul li').length === 3);
  check('a numbered list renders', () => draw('1. a\n2. b').querySelectorAll('ol li').length === 2);
  check('a blockquote renders', () => Boolean(draw('> noted').querySelector('.md-quote')));

  /* The safety properties. These matter most and are the easiest to lose in a
     refactor to innerHTML. */
  // The closing tag is written <\/script> deliberately: an HTML parser ends
  // the enclosing <script> at the first literal one, wherever it appears —
  // including inside a JS string. That truncated this whole file once.
  const nasty = draw('<script>alert(1)<\/script> and <img src=x onerror=alert(2)>');
  check('a script tag is text, not an element', () => !nasty.querySelector('script'));
  check('an img tag is text, not an element', () => !nasty.querySelector('img'));
  check('the angle brackets survive as characters', () => nasty.textContent.includes('<scr' + 'ipt>'));
  check('a javascript: link is not made into a link',
    () => !draw('[tap](javascript:alert(1))').querySelector('a'));
  check('an http link is',
    () => draw('[docs](https://example.com)').querySelector('a')?.href === 'https://example.com/');
  check('links open away from the app',
    () => draw('[d](https://example.com)').querySelector('a').rel.includes('noopener'));

  check('empty input renders nothing', () => draw('').childNodes.length === 0);
  check('null does not throw', () => draw(null).childNodes.length === 0);
}
if (md.looksLikeMarkdown) {
  check('a table is recognised as markdown', () => md.looksLikeMarkdown('| a | b |\n|---|---|') === true);
  check('a heading is', () => md.looksLikeMarkdown('# Hi') === true);
  check('bold is', () => md.looksLikeMarkdown('some **bold** text') === true);
  check('a plain sentence is not', () => md.looksLikeMarkdown('Went for a run, felt fine.') === false);
  check('an empty string is not', () => md.looksLikeMarkdown('') === false);
}

/* ------------------------------------------------------------------ */
/* Paste provenance                                                    */
/* ------------------------------------------------------------------ */
/* The line has to be truthful above all: it must never name a source it did
   not actually read, because this writes into Ben's own diary. */
group('paste - says when, and only says where when it knows');
const paste = loaded['../js/paste.js'] || {};
if (paste.provenanceLine) {
  const when = new Date(2026, 7, 31, 17, 20);
  check('names a source when there is one',
    () => paste.provenanceLine('claude.ai', when).startsWith('> Pasted from claude.ai'));
  check('says only when, with no source',
    () => paste.provenanceLine('', when) === '> Pasted Mon 31 Aug 2026, 17:20');
  check('is a blockquote so it renders as a caption',
    () => paste.provenanceLine('', when).startsWith('> '));
}
if (paste.sourceFromClipboard) {
  const fake = (html) => ({ getData: (t) => (t === 'text/html' ? html : '') });
  check('reads a SourceURL header',
    () => paste.sourceFromClipboard(fake('SourceURL:https://claude.ai/chat/1')) === 'claude.ai');
  check('reads a base href',
    () => paste.sourceFromClipboard(fake('<base href="https://example.com/x">')) === 'example.com');
  check('drops the www',
    () => paste.sourceFromClipboard(fake('SourceURL:https://www.example.com/')) === 'example.com');
  // A link inside the copied text is not where the copy came from.
  check('a link in the content is not treated as the source',
    () => paste.sourceFromClipboard(fake('<p><a href="https://bbc.co.uk">news</a></p>')) === '');
  check('a non-http scheme is refused',
    () => paste.sourceFromClipboard(fake('SourceURL:file:///C:/secrets.txt')) === '');
  check('no html flavour means no source', () => paste.sourceFromClipboard(fake('')) === '');
  check('a broken clipboard does not throw', () => paste.sourceFromClipboard(null) === '');
}

/* ------------------------------------------------------------------ */
/* Find                                                                */
/* ------------------------------------------------------------------ */
/* Everything this app holds is filed by day, which is right for "what am I
   doing today" and useless for "where is that thing about the heater". The
   search has to reach the places a thing can hide: a title, the notes field,
   the comment written afterwards, a note dictated onto it, a diary entry, and
   a line caught in the note app. */
group('search - reaches every place something can hide');
const finder = loaded['../js/search.js'] || {};
if (finder.search) {
  const doc = {
    items: [
      { id: 'a', kind: 'task', title: 'Work with Glbo on the heater', notes: '', comment: '', log: [] },
      { id: 'b', kind: 'task', title: 'PARA 10 prep', notes: '16kg, aim for sub 2h', comment: '', log: [] },
      { id: 'c', kind: 'task', title: 'Serialised kit check', notes: '', comment: 'took longer than planned', log: [] },
      { id: 'd', kind: 'task', title: 'Chase stores', notes: '', comment: '', log: [{ id: 'n1', text: 'needs a new element' }] },
      { id: 'e', kind: 'task', title: 'Old binned thing about heaters', deleted: true, log: [] },
      { id: 'f', kind: 'task', title: 'Book MOT', done: true, notes: '', comment: '', log: [] },
    ],
    journal: { '2026-09-01': { text: 'Chased the heater again.' } },
    captures: [
      { id: 'c1', text: 'order new boots before para 10', at: '2026-09-02T10:00:00.000Z' },
      { id: 'c2', text: 'binned line', deleted: true, at: '2026-09-02T10:00:00.000Z' },
    ],
  };
  const find = (q) => finder.search(q, doc);
  const ids = (q) => find(q).map((h) => h.id).sort().join(',');

  check('finds a title', () => find('Glbo').some((h) => h.id === 'a'));
  check('finds the notes field', () => find('16kg').some((h) => h.id === 'b' && h.where === 'note'));
  check('finds a comment written afterwards', () => find('longer').some((h) => h.id === 'c' && h.where === 'comment'));
  check('finds a note dictated onto a task', () => find('element').some((h) => h.id === 'd' && h.where === 'log'));
  check('finds a diary entry', () => find('chased').some((h) => h.kind === 'entry'));
  check('finds a caught line', () => find('boots').some((h) => h.kind === 'capture'));
  check('finds something already done', () => find('MOT').some((h) => h.id === 'f'));

  // Deleted things are deleted.
  check('a binned task is not found', () => !find('binned thing').some((h) => h.id === 'e'));
  check('a binned capture is not found', () => !find('binned line').length);

  // Every term must appear, or two words returns everything containing either
  // -- the behaviour that makes people stop using a search box.
  check('every term must match', () => ids('heater glbo') === 'a');
  check('a term matching nothing rules the result out', () => find('glbo zzzz').length === 0);
  // ...though the terms may match different fields of the same item.
  check('terms may match different fields', () => find('chase element').some((h) => h.id === 'd'));

  check('a title beats a note', () => {
    const r = find('heater');
    return r[0].kind === 'task' && r[0].where === 'title';
  });
  check('one letter is not a search', () => find('a').length === 0);
  check('an empty query finds nothing', () => find('   ').length === 0);
  check('case does not matter', () => find('GLBO').some((h) => h.id === 'a'));
  check('an empty document does not throw', () => finder.search('heater', {}).length === 0);
}
if (finder.snippet) {
  check('a snippet centres on the hit', () => finder.snippet('the quick brown fox jumps over the lazy dog and keeps going for a while yet', 'lazy').includes('lazy'));
  check('a short text is returned whole', () => finder.snippet('short one', 'short') === 'short one');
  check('an empty text gives an empty snippet', () => finder.snippet('', 'x') === '');
}

/* ------------------------------------------------------------------ */
/* Zones                                                               */
/* ------------------------------------------------------------------ */
/* instantAt() takes a fast path -- one offset for the whole day, then plain
   arithmetic -- and falls back to asking Intl properly on a day whose offset
   changes. That is a 23x speed-up and exactly the kind of shortcut that is
   right for 361 days a year and wrong on the four that matter. So the two
   paths are compared directly, on and around both UK clock changes. */
group('zones - the fast path agrees with the exact one');
const zones = loaded['../js/zones.js'] || {};
if (zones.instantAt && zones.instantForZonedTime) {
  const UK = 'Europe/London';
  const exact = (key, min) => {
    const [y, m, d] = key.split('-').map(Number);
    return zones.instantForZonedTime(y, m, d, 0, min, UK).getTime();
  };
  const agrees = (key) => [0, 60, 90, 120, 150, 300, 720, 1439]
    .every((min) => zones.instantAt(key, min, UK).getTime() === exact(key, min));

  check('an ordinary day agrees', () => agrees('2026-09-02'));
  // Clocks go back 25 Oct 2026 and forward 29 Mar 2026.
  check('the day the clocks go back agrees', () => agrees('2026-10-25'));
  check('the day either side of it agrees', () => agrees('2026-10-24') && agrees('2026-10-26'));
  check('the day the clocks go forward agrees', () => agrees('2026-03-29'));
  check('and either side of that', () => agrees('2026-03-28') && agrees('2026-03-30'));
  // Past midnight the offset belongs to a different day, so that must not
  // take the shortcut.
  check('an overnight minute count agrees', () => zones.instantAt('2026-10-24', 1800, UK).getTime() === exact('2026-10-24', 1800));

  // The gap to Manila really does change, which is the whole reason none of
  // this stores an offset.
  check('Manila is 7h ahead in summer', () => zones.describeGap(new Date('2026-09-02T12:00:00Z'), UK, 'Asia/Manila') === '7h ahead');
  check('and 8h ahead in winter', () => zones.describeGap(new Date('2026-12-02T12:00:00Z'), UK, 'Asia/Manila') === '8h ahead');
}

/* ------------------------------------------------------------------ */
/* Both free                                                           */
/* ------------------------------------------------------------------ */
/* Two rotas, seven or eight hours apart depending on the month. The whole
   value is in the arithmetic nobody can do in their head at the end of four
   nights, so the arithmetic is what gets pinned. */
group('together - two rotas, two timezones');
const tog = loaded['../js/together.js'] || {};
const UK = 'Europe/London';
const PH = 'Asia/Manila';

if (tog.parseShiftWindow) {
  const w = (t) => tog.parseShiftWindow(t);
  // 11-7, 7-3 and 3-11 are all written on a twelve-hour clock with no am/pm.
  // The shift WORD is the only thing that says which is which.
  check('a night runs into tomorrow', () => w('Sheila: Night (11-7)').start === 1380 && w('Sheila: Night (11-7)').end === 1860);
  check('a morning is am to pm', () => w('Sheila: Morning (7-3)').start === 420 && w('Sheila: Morning (7-3)').end === 900);
  check('an afternoon is pm to pm', () => w('Sheila: Afternoon (3-11)').start === 900 && w('Sheila: Afternoon (3-11)').end === 1380);
  check('OFF is off, not a window', () => w('Sheila: OFF').off === true);
  check('something with no hours is not a shift', () => w('Sheila: dentist') === null);
  // "2-3" in a non-shift entry must not be mistaken for a rota line by name
  // detection, which is why three matches are required below.
  check('a lone name does not make a partner', () => tog.partnerName([{ title: 'Sheila: Night (11-7)' }]) === null);
  check('three shift-shaped entries do', () => tog.partnerName([
    { title: 'Sheila: Night (11-7)' }, { title: 'Sheila: OFF' }, { title: 'Sheila: Morning (7-3)' },
  ]) === 'Sheila');
  check('his own shifts are not a partner', () => tog.partnerName([
    { title: 'Night Shift' }, { title: 'Day Shift' }, { title: 'Training Day' },
  ]) === null);
}

if (tog.freeFrom) {
  check('free time is the gaps between busy', () => JSON.stringify(tog.freeFrom([[0, 420], [1380, 1440]])) === JSON.stringify([[420, 1380]]));
  check('overlapping busy spans merge', () => JSON.stringify(tog.freeFrom([[0, 600], [300, 900]])) === JSON.stringify([[900, 1440]]));
  check('a clear day is free all day', () => JSON.stringify(tog.freeFrom([])) === JSON.stringify([[0, 1440]]));
}

if (tog.windowsOn && dates.addDays) {
  const cal = (map) => (key) => (map[key] || []).map((title) => ({ title }));
  const opts = (map) => ({ itemsOnDay: cal(map), addDays: dates.addDays, name: 'Sheila', homeTz: UK, awayTz: PH });
  const D = '2026-09-02';

  const bothOff = tog.windowsOn(D, opts({
    '2026-09-01': ['Sheila: OFF'], '2026-09-02': ['Sheila: OFF'], '2026-09-03': ['Sheila: OFF'],
  }));
  check('two free days give a window', () => bothOff.windows.length === 1);
  // His morning is her afternoon. If this ever reads the same clock time on
  // both sides, the zone conversion has been lost.
  check('and it reads differently in each zone', () => {
    const uk = tog.describeWindow(bothOff.windows[0], UK);
    const ph = tog.describeWindow(bothOff.windows[0], PH);
    return uk !== ph && uk === '07:00\u201316:00' && ph === '14:00\u201323:00';
  });

  // He finishes at 18:30; his evening is her small hours. There is genuinely
  // nothing here, and inventing one would be worse than saying so.
  const heWorks = tog.windowsOn(D, opts({
    '2026-09-01': ['Day Shift', 'Sheila: OFF'],
    '2026-09-02': ['Day Shift', 'Sheila: OFF'],
    '2026-09-03': ['Day Shift', 'Sheila: OFF'],
  }));
  check('a day shift against a 7-hour gap leaves nothing', () => heWorks.windows.length === 0);

  // The one worth having: up mid-afternoon before nights, which is her evening.
  const nights = tog.windowsOn(D, opts({
    '2026-09-01': ['Sheila: Morning (7-3)'],
    '2026-09-02': ['Night Shift', 'Sheila: Morning (7-3)'],
    '2026-09-03': ['Night Shift', 'Sheila: Morning (7-3)'],
  }));
  check('the afternoon before nights is a window', () => nights.windows.length >= 1);
  check('and it says what it assumed', () => nights.assumed.some((a) => /mid-afternoon/.test(a)));

  // Silence about a day nobody has filled in, rather than good news.
  const blank = tog.windowsOn(D, opts({ '2026-09-02': ['Day Shift'] }));
  check('an unwritten rota is not treated as free', () => blank.known === false);
  check('and offers no windows', () => blank.windows.length === 0);
  check('no partner means no answer at all', () => {
    const r = tog.windowsOn(D, { ...opts({}), name: null });
    return r.known === false && r.windows.length === 0;
  });
}

/* ------------------------------------------------------------------ */
/* Shortcuts                                                           */
/* ------------------------------------------------------------------ */
group('shortcuts — the panel cannot promise a key that does nothing');
const shortcuts = loaded['../js/shortcuts.js'];
if (shortcuts?.SHORTCUTS) {
  const keyed = shortcuts.SHORTCUTS.filter((s) => s.key);
  check('every declared key has a label', () => keyed.every((s) => s.label));
  check('every declared key has something to display', () => keyed.every((s) => s.display?.length));
  check('no key is declared twice', () => new Set(keyed.map((s) => s.key)).size === keyed.length);
  check('letter keys are lower case, as the caveats claim', () => keyed.filter((s) => s.key.length === 1).every((s) => s.key === s.key.toLowerCase()));
}

/* ------------------------------------------------------------------ */
const summary = document.getElementById('summary');
summary.className = failed ? 'bad' : 'ok';
summary.textContent = failed
  ? `${failed} failed, ${passed} passed`
  : `All ${passed} checks passed`;
</script>

</body>
</html>
